<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Custom Home University — professional plan reviews for homeowners building custom homes.">
  <title>Custom Home University</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/config.js" defer></script>
  <script src="assets/site.js" defer></script>
</head>
<body data-page="home">
  <main class="landing-container">
    <div class="landing-content">
      <h1 class="brand-heading">Custom Home University</h1>
      <section class="video-frame" id="videoMount" aria-label="Introduction video">
        <div class="video-placeholder"><span class="play-ring" aria-hidden="true"><svg width="24" height="27" viewBox="0 0 24 27" fill="none"><path d="M4 2.8 21 13.5 4 24.2V2.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span><span class="placeholder-caption">Introduction video coming soon</span></div>
      </section>
      <section class="email-section" aria-labelledby="email-heading">
        <h2 id="email-heading">Start your private plan review.</h2>
        <form id="leadForm" class="email-form" novalidate>
          <label class="visually-hidden" for="leadEmail">Your email address</label>
          <input id="leadEmail" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="Enter your email address">
          <label class="visually-hidden" for="leadPhone">Your cell phone number</label>
          <input id="leadPhone" type="tel" name="phone" autocomplete="tel" inputmode="tel" required maxlength="32" placeholder="Enter your cell phone number">
          <button class="primary-button" id="leadSubmit" type="submit">Continue to application <span aria-hidden="true">↗</span></button>
          <input type="text" name="website" class="honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">
        </form>
        <p class="helper-text">We'll use your email and phone to discuss your plan review. No payment required to apply.</p>
        <p id="leadStatus" class="form-status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <footer class="site-footer">© <span data-year></span> Custom Home University <span aria-hidden="true">·</span> <a href="privacy.html">Privacy</a></footer>
  </main>
  <iframe name="chuSubmissionFrame" id="chuSubmissionFrame" class="submission-frame" title="Form submission confirmation"></iframe>
</body>
</html>
