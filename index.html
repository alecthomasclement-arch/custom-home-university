<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Custom Home University — professional plan reviews for homeowners building custom homes.">
  <title>Custom Home University</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css?v=limited-slots-20261118">
  <script src="assets/config.js?v=afZ-vERgfIo-20261118" defer></script>
  <script src="assets/site.js?v=afZ-vERgfIo-20261118" defer></script>
</head>
<body data-page="home">
  <main class="landing-container">
    <div class="landing-content">
      <h1 class="brand-heading">Custom Home University</h1>
      <section class="video-frame is-portrait-video" id="videoMount" aria-label="Custom Home University introduction video">
        <iframe
          data-pinned-video="afZ-vERgfIo"
          src="https://www.youtube-nocookie.com/embed/afZ-vERgfIo"
          title="Custom Home University introduction video"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </section>
      <section class="email-section limited-signup" aria-labelledby="email-heading">
        <h2 id="email-heading">Available slots are limited.</h2>
        <p class="capacity-note">I accept no more than 50 new clients per year to ensure each review receives my personal attention.</p>
        <form id="leadForm" class="email-form" data-lead-form novalidate>
          <label class="visually-hidden" for="leadEmail">Your email address</label>
          <input id="leadEmail" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="Enter your email address">
          <label class="visually-hidden" for="leadPhone">Cell phone number (optional)</label>
          <input id="leadPhone" type="tel" name="phone" autocomplete="tel" inputmode="tel" maxlength="32" placeholder="Cell phone number (optional)">
          <button class="primary-button" id="leadSubmit" type="submit">Continue to application <span aria-hidden="true">↗</span></button>
          <input type="text" name="website" class="honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">
        </form>
        <p class="helper-text">We'll use your email to discuss your plan review. A phone number is optional. No payment required to apply.</p>
        <p id="leadStatus" class="form-status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <footer class="site-footer">© <span data-year></span> Custom Home University <span aria-hidden="true">·</span> <a href="privacy.html">Privacy</a></footer>
  </main>
  <iframe name="chuSubmissionFrame" id="chuSubmissionFrame" class="submission-frame" title="Form submission confirmation"></iframe>
</body>
</html>
